<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            background:#f5f7fa;
            font-family:Arial;
        }

        .box{
            width:400px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,.1);
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:10px;
            background:#2563eb;
            color:white;
            border:none;
        }
    </style>
</head>

<body>

<div class="box">

<h2>VendorBridge Login</h2>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">
Login
</button>

</form>

<br>

<a href="{% url 'accounts:register' %}">
Create Account
</a>

</div>

</body>
</html>
