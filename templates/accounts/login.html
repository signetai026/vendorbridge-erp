<!DOCTYPE html>
<html>
<head>
    <title>VendorBridge Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#0f172a,#2563eb);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .card{
            width:420px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 40px rgba(0,0,0,.2);
        }
        h2{
            text-align:center;
            margin-bottom:25px;
            color:#0f172a;
        }
        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            margin-bottom:15px;
        }
        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover{
            background:#1d4ed8;
        }
        a{
            color:#2563eb;
            text-decoration:none;
        }
        .links{
            margin-top:20px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 VendorBridge ERP</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <div class="links">
        <a href="{% url 'accounts:register' %}">Create Account</a>
        <br><br>
        <a href="#"></a>
    </div>
</div>

</body>
</html>
